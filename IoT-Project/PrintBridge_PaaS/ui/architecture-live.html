<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintBridge-PaaS — Live Architecture</title>
  <link rel="icon" type="image/png" href="P2P_FAVICON.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-nav.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg: #070d1a;
      --bg2: #0d1829;
      --bg3: #111f35;
      --teal: #00e5c0;
      --purple: #a87fd4;
      --purple-bright: #a87fd4;
      --amber: #ffc24b;
      --coral: #ff6b5b;
      --green: #00e676;
      --blue: #4fc3f7;
      --grid: rgba(255,255,255,0.03);
      --text: #e0e8f5;
      --muted: #4a6080;
      --border: rgba(255,255,255,0.06);
      --paper: #faf9f6;
      --cream: #f2efe8;
      --rule: #d8d4c8;
      --saffron: #d97706;
      --navy: #1e293b;
      --ink: #1a1a1a;
      --ink-muted: #7a7a7a;
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    
    .controls {
      display: flex; gap: 10px; align-items: center;
    }
    .btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      background: var(--teal); color: #070d1a;
    }
    .btn-primary:hover { background: #00c4a8; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
    
    .speed-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .speed-wrap select {
      background: var(--bg2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: 'Outfit', sans-serif;
    }
    
    /* Main layout */
    .main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      height: calc(100vh - 125px);
      margin-top: 60px;
    }
    
    /* Canvas area */
    .canvas-area {
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    
    canvas#arch {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Step indicator */
    .step-bar {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(13,24,41,0.9);
      border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px;
      backdrop-filter: blur(12px);
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); transition: all 0.4s;
    }
    .step-dot.active { background: var(--teal); box-shadow: 0 0 8px var(--teal); transform: scale(1.3); }
    .step-dot.done { background: var(--green); }
    
    /* Right panel */
    .side-panel {
      border-left: 1px solid var(--border);
      background: var(--bg2);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      color: var(--muted); text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      display: flex; align-items: center; gap: 8px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(0,230,118,0.4); }
      50% { opacity:0.7; box-shadow: 0 0 0 4px rgba(0,230,118,0); }
    }
    
    .log-area {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 6px;
      scroll-behavior: smooth;
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-track { background: transparent; }
    .log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    
    .log-entry {
      padding: 10px 12px; border-radius: 8px;
      border-left: 3px solid transparent;
      background: rgba(255,255,255,0.03);
      font-size: 12px; line-height: 1.6;
      animation: slideIn 0.3s ease;
      opacity: 0; animation-fill-mode: forwards;
    }
    @keyframes slideIn {
      from { opacity:0; transform: translateX(8px); }
      to { opacity:1; transform: translateX(0); }
    }
    .log-entry.user    { border-color: var(--teal); }
    .log-entry.server  { border-color: var(--purple-bright); }
    .log-entry.payment { border-color: var(--amber); }
    .log-entry.hw      { border-color: var(--coral); }
    .log-entry.success { border-color: var(--green); }
    
    .log-tag {
      font-family: 'Space Mono', monospace; font-size: 9px;
      font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; margin-bottom: 3px;
    }
    .log-entry.user .log-tag    { color: var(--teal); }
    .log-entry.server .log-tag  { color: var(--purple-bright); }
    .log-entry.payment .log-tag { color: var(--amber); }
    .log-entry.hw .log-tag      { color: var(--coral); }
    .log-entry.success .log-tag { color: var(--green); }
    .log-msg { color: var(--text); }
    .log-code { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 3px; }
    
    /* Stats strip */
    .stats-strip {
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--border);
    }
    .stat-cell {
      background: var(--bg2); padding: 12px 16px;
    }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .stat-value { font-size: 18px; font-weight: 700; font-family: 'Space Mono', monospace; }
    .stat-value.teal { color: var(--teal); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.green { color: var(--green); }
    .stat-value.coral { color: var(--coral); }
    
    /* Current step overlay */
    .step-overlay {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(13,24,41,0.92); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 24px; text-align: center;
      backdrop-filter: blur(12px); min-width: 280px;
      transition: all 0.4s;
    }
    .step-num { font-size: 10px; color: var(--muted); font-family: 'Space Mono', monospace; margin-bottom: 4px; }
    .step-title { font-size: 15px; font-weight: 600; }
    .step-desc { font-size: 11px; color: var(--muted); margin-top: 3px; }
  </style>
</head>
<body>

<div class="controls" style="position: fixed; top: 70px; right: 20px; z-index: 100; display: flex; gap: 10px; align-items: center;">
  <div class="speed-wrap">
    Speed:
    <select id="speedSel">
      <option value="2">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="0.5">2×</option>
      <option value="0.25">4×</option>
    </select>
  </div>
  <button class="btn btn-ghost" id="pauseBtn">⏸ Pause</button>
  <button class="btn btn-primary" id="restartBtn">↺ Restart</button>
</div>

<div class="main">
  <div class="canvas-area">
    <canvas id="arch"></canvas>
    <div class="step-overlay" id="stepOverlay">
      <div class="step-num">STEP 0 / 12</div>
      <div class="step-title">Initializing system...</div>
      <div class="step-desc">PrintBridge-PaaS is ready for a print request</div>
    </div>
    <div class="step-bar" id="stepBar"></div>
  </div>

  <div class="side-panel">
    <div class="panel-header">
      <div class="live-dot"></div>
      System Log
    </div>
    <div class="log-area" id="logArea"></div>
    <div class="stats-strip">
      <div class="stat-cell">
        <div class="stat-label">Pages</div>
        <div class="stat-value teal" id="statPages">—</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Amount</div>
        <div class="stat-value amber" id="statAmt">—</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Status</div>
        <div class="stat-value coral" id="statStatus">Idle</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Ticket</div>
        <div class="stat-value green" id="statTicket">—</div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div style="background: var(--bg2); border-top: 1px solid var(--border); padding: 24px 20px; text-align: center;">
  <div style="font-size: 13px; color: var(--muted);">
    <strong style="color: var(--text);">PrintBridge-PaaS</strong> — IoT Cloud Printing System by Team VPS
  </div>
</div>

<script src="shared-nav.js"></script>
<script src="architecture-live.js"></script>
</body>
</html>
